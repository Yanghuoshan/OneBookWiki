[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onebookwiki"
version = "0.1.0"
description = "Evidence-grounded, retrieval-first analysis of a single book"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
rag = ["tiktoken>=0.7", "numpy>=1.26", "faiss-cpu>=1.8"]
local-embeddings = ["sentence-transformers>=3.0"]
cloud = ["openai>=1.0", "pymupdf>=1.24", "json-repair>=0.30"]
pdf-ocr = ["numpy>=1.26", "paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4"]
text = ["charset-normalizer>=3.3"]
docx = ["python-docx>=1.1"]
kindle = ["mobi==0.4.1"]
imports = ["charset-normalizer>=3.3", "python-docx>=1.1", "olefile>=0.47", "mobi==0.4.1"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.12", "python-dotenv>=1.0", "openai>=1.0"]
all = ["tiktoken>=0.7", "numpy>=1.26", "faiss-cpu>=1.8", "sentence-transformers>=3.0", "openai>=1.0", "pymupdf>=1.24", "json-repair>=0.30", "paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4", "charset-normalizer>=3.3", "python-docx>=1.1", "olefile>=0.47", "mobi==0.4.1", "fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.12", "python-dotenv>=1.0"]

[project.scripts]
onebookwiki-build = "onebookwiki.cli.build_wiki:main"
onebookwiki-generate = "onebookwiki.cli.generate_wiki:main"
onebookwiki-ingest = "onebookwiki.cli.ingest_book:main"
onebookwiki-ingest-epub = "onebookwiki.cli.ingest_epub:main"
onebookwiki-ingest-pdf = "onebookwiki.cli.ingest_pdf:main"
onebookwiki-check = "onebookwiki.cli.check_book:main"
onebookwiki-cost = "onebookwiki.cli.report_cost:main"

[tool.setuptools.packages.find]
include = ["onebookwiki*", "server*"]
