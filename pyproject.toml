[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onebookwiki"
version = "0.1.0"
description = "Evidence-grounded, retrieval-first analysis of a single book"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
rag = ["tiktoken>=0.7", "numpy>=1.26", "faiss-cpu>=1.8"]
local-embeddings = ["sentence-transformers>=3.0"]
cloud = ["openai>=1.0", "pymupdf>=1.24", "json-repair>=0.30"]
pdf-ocr = ["numpy>=1.26", "paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4"]
text = ["charset-normalizer>=3.3"]
docx = ["python-docx>=1.1"]
doc = ["legacy-doc==0.2.1", "olefile>=0.47"]
kindle = ["mobi==0.4.1"]
imports = ["charset-normalizer>=3.3", "python-docx>=1.1", "legacy-doc==0.2.1", "olefile>=0.47", "mobi==0.4.1"]
all = ["tiktoken>=0.7", "numpy>=1.26", "faiss-cpu>=1.8", "sentence-transformers>=3.0", "openai>=1.0", "pymupdf>=1.24", "json-repair>=0.30", "paddleocr>=3.0,<4", "paddlepaddle>=3.0,<4", "charset-normalizer>=3.3", "python-docx>=1.1", "legacy-doc==0.2.1", "olefile>=0.47", "mobi==0.4.1"]

[tool.setuptools.packages.find]
include = ["onebookwiki*"]
