version: "3.9"

services:
  onebookwiki:
    build: .
    ports:
      - "${ONEBOOKWIKI_PORT:-8000}:8000"
    volumes:
      - ./books:/app/books
      - ./.env:/app/.env:ro
    environment: &onebookwiki-environment
      ONEBOOKWIKI_HOST: 0.0.0.0
      ONEBOOKWIKI_PORT: 8000
      ONEBOOKWIKI_BOOKS_ROOT: /app/books
      ONEBOOKWIKI_LLM_PROVIDER: ${ONEBOOKWIKI_LLM_PROVIDER:-}
      ONEBOOKWIKI_LLM_API_KEY: ${ONEBOOKWIKI_LLM_API_KEY:-}
      ONEBOOKWIKI_LLM_MODEL: ${ONEBOOKWIKI_LLM_MODEL:-}
      ONEBOOKWIKI_LLM_BASE_URL: ${ONEBOOKWIKI_LLM_BASE_URL:-}
      ONEBOOKWIKI_EMBEDDING_BASE_URL: ${ONEBOOKWIKI_EMBEDDING_BASE_URL:-}
      ONEBOOKWIKI_EMBEDDING_MODEL: ${ONEBOOKWIKI_EMBEDDING_MODEL:-}
      ONEBOOKWIKI_BGE_M3_MODEL: ${ONEBOOKWIKI_BGE_M3_MODEL:-}
      ONEBOOKWIKI_ADMIN_TOKEN: ${ONEBOOKWIKI_ADMIN_TOKEN:-}
      ONEBOOKWIKI_CHAT_LEASE_SECONDS: ${ONEBOOKWIKI_CHAT_LEASE_SECONDS:-300}
      ONEBOOKWIKI_CHAT_LEASE_HEARTBEAT: ${ONEBOOKWIKI_CHAT_LEASE_HEARTBEAT:-60}
      ONEBOOKWIKI_CHAT_EMBEDDING_BACKEND: ${ONEBOOKWIKI_CHAT_EMBEDDING_BACKEND:-bge-m3}
      ONEBOOKWIKI_CHAT_AGENT_RETRIEVAL: ${ONEBOOKWIKI_CHAT_AGENT_RETRIEVAL:-hybrid}
      ONEBOOKWIKI_CHAT_AGENT_MAX_ACTIONS: ${ONEBOOKWIKI_CHAT_AGENT_MAX_ACTIONS:-7}
      ONEBOOKWIKI_CHAT_AGENT_MAX_SECONDS: ${ONEBOOKWIKI_CHAT_AGENT_MAX_SECONDS:-240}
      ONEBOOKWIKI_CHAT_AGENT_OBSERVATION_TOKENS: ${ONEBOOKWIKI_CHAT_AGENT_OBSERVATION_TOKENS:-1400}
      ONEBOOKWIKI_CHAT_AGENT_PLANNER_TOKENS: ${ONEBOOKWIKI_CHAT_AGENT_PLANNER_TOKENS:-360}
      ONEBOOKWIKI_CHAT_AGENT_PAGE_RESULTS: ${ONEBOOKWIKI_CHAT_AGENT_PAGE_RESULTS:-6}
      ONEBOOKWIKI_CHAT_AGENT_RAW_CANDIDATES: ${ONEBOOKWIKI_CHAT_AGENT_RAW_CANDIDATES:-8}
      ONEBOOKWIKI_CHAT_AGENT_MAX_EVIDENCE: ${ONEBOOKWIKI_CHAT_AGENT_MAX_EVIDENCE:-6}
      ONEBOOKWIKI_CHAT_AGENT_EVIDENCE_TOKENS: ${ONEBOOKWIKI_CHAT_AGENT_EVIDENCE_TOKENS:-3600}
      ONEBOOKWIKI_CHAT_WORKER_IDLE: ${ONEBOOKWIKI_CHAT_WORKER_IDLE:-1}
    restart: unless-stopped

  chat-worker:
    build: .
    command: ["python", "-m", "server.chat_worker"]
    volumes:
      - ./books:/app/books
      - ./.env:/app/.env:ro
    environment: *onebookwiki-environment
    depends_on:
      - onebookwiki
    restart: unless-stopped
